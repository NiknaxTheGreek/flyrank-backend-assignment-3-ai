      - name: Show Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker --version | tee /tmp/docker-version.txt
          docker compose version | tee /tmp/compose-version.txt

      - name: Install test dependencies and run regression suite
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q | tee /tmp/pytest.txt

      - name: Create CI environment
        working-directory: /tmp/project
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=flyrank
          POSTGRES_PASSWORD=ci-assignment-3-password
          POSTGRES_DB=flyrank_tasks
          EOF

      - name: Validate Compose configuration
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          docker compose config | tee /tmp/compose-config.txt

      - name: Build and start FastAPI plus PostgreSQL
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build
          docker compose ps

      - name: Wait for API health
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health-before.json; then
              cat /tmp/health-before.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Create and update persistent task
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8000/tasks | tee /tmp/tasks-before.json

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"title":"Persist through Compose restart","description":"Created by GitHub Actions"}' \
            http://127.0.0.1:8000/tasks | tee /tmp/created.json

          python - <<'PY2' > /tmp/task-id
          import json
          from pathlib import Path
          created = json.loads(Path('/tmp/created.json').read_text())
          assert created['title'] == 'Persist through Compose restart'
          assert created['completed'] is False
          print(created['id'])
          PY2

          TASK_ID="$(cat /tmp/task-id)"
          echo "TASK_ID=$TASK_ID" >> "$GITHUB_ENV"

          curl --fail --silent \
            -X PUT \
            -H 'Content-Type: application/json' \
            -d '{"completed":true}' \
            "http://127.0.0.1:8000/tasks/$TASK_ID" | tee /tmp/updated.json

          python - <<'PY2'
          import json
          from pathlib import Path
          updated = json.loads(Path('/tmp/updated.json').read_text())
          assert updated['completed'] is True
          PY2

      - name: Stop stack without deleting PostgreSQL volume
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          docker compose down

      - name: Restart stack from same named volume
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d

      - name: Wait for restarted API
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health-after.json; then
              cat /tmp/health-after.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Prove PostgreSQL volume persistence
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent \
            "http://127.0.0.1:8000/task/$TASK_ID" | tee /tmp/persisted.json

          python - <<'PY2'
          import json
          from pathlib import Path
          persisted = json.loads(Path('/tmp/persisted.json').read_text())
          assert persisted['title'] == 'Persist through Compose restart'
          assert persisted['description'] == 'Created by GitHub Actions'
          assert persisted['completed'] is True
          print('PERSISTENCE_CHECK=PASS')
          PY2

          docker compose exec -T db \
            psql -U flyrank -d flyrank_tasks \
            -c "SELECT id, title, completed FROM tasks ORDER BY id;" \
            | tee /tmp/postgres-rows.txt

      - name: Capture final runtime evidence in repository
        working-directory: /tmp/project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo '# Assignment 3 GitHub Actions Docker/PostgreSQL Evidence'
            echo
            echo "UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Docker runtime'
            cat /tmp/docker-version.txt
            cat /tmp/compose-version.txt
            echo
            echo '## Regression tests'
            cat /tmp/pytest.txt
            echo
            echo '## Health before restart'
            cat /tmp/health-before.json
            echo
            echo '## Created task'
            cat /tmp/created.json
            echo
            echo '## Updated task'
            cat /tmp/updated.json
            echo
            echo '## Health after docker compose down/up'
            cat /tmp/health-after.json
            echo
            echo '## Persisted task after restart'
            cat /tmp/persisted.json
            echo
            echo '## Direct PostgreSQL rows'
            cat /tmp/postgres-rows.txt
            echo
            echo 'PERSISTENCE_CHECK=PASS'
            echo 'DOCKER_COMPOSE_RUNTIME_GATE=PASS'
          } > evidence/github-actions-docker-postgres.txt

          cat > evidence/requirements-audit.md <<'EOF'
          # Assignment 3 Requirements Audit — AI-generated version

          ## Final status

          **PASS — Assignment 3 implementation and real Docker/PostgreSQL runtime gate verified.**

          ## Verified requirements

          - CRUD API contract preserved.
          - FastAPI runs in the `api` container.
          - PostgreSQL runs in the `db` container.
          - Dockerfile builds the API image.
          - Docker Compose starts both services.
          - Named volume `postgres_data` persists database state.
          - Database credentials/config are supplied through environment variables.
          - Container-to-container database traffic uses `db:5432`.
          - PostgreSQL readiness is enforced with `pg_isready` and Compose health dependency.
          - `tasks` table is created automatically.
          - Exactly three starter tasks are inserted when the table is empty without duplicate reseeding.
          - SQLAlchemy bound expressions parameterize database operations.
          - SQL-like hostile input is treated as data.
          - CRUD data survives `docker compose down` followed by `docker compose up` without `-v`.
          - Persistence is verified both through the HTTP API and by direct `psql` query.
          - Automated regression suite passes on the GitHub-hosted runner.
          - `.env` remains ignored; `.env.example` documents required variables.
          - Public AI-generated repository exists independently from the human PC implementation.

          ## Evidence

          - `evidence/github-actions-docker-postgres.txt`
          - GitHub Actions run for `Bootstrap and Verify Assignment 3`
          - Existing sandbox evidence remains retained for historical transparency.

          ## Rematch status

          Human-vs-AI comparison remains pending until the independent human-created Assignment 3 implementation is complete.
          EOF

          python - <<'PY2'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace(
              "The automated suite uses a temporary SQLite database for deterministic API/database logic tests and separately checks the Docker/Compose configuration. The assignment's real PostgreSQL/Compose persistence checkpoint must still be run in a Docker-capable environment.",
              "The automated suite uses a temporary SQLite database for deterministic API/database logic tests and separately checks the Docker/Compose configuration. Real Docker Compose + PostgreSQL persistence is additionally verified on a GitHub-hosted runner; see `evidence/github-actions-docker-postgres.txt`."
          )
          text = text.replace(
              "See `evidence/` for the requirements audit and the verified sandbox checkpoints. Evidence that cannot be truthfully produced in this ChatGPT runtime is explicitly marked as pending rather than invented.",
              "See `evidence/` for the requirements audit, sandbox checkpoints, and the real GitHub Actions Docker/PostgreSQL persistence proof."
          )
          path.write_text(text)
          PY2

      - name: Capture diagnostic artifact
        if: always()
        working-directory: /tmp/project
        shell: bash
        run: |
          mkdir -p ci-evidence
          docker compose ps > ci-evidence/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > ci-evidence/compose-logs.txt 2>&1 || true
          cp /tmp/docker-version.txt ci-evidence/ 2>/dev/null || true
          cp /tmp/compose-version.txt ci-evidence/ 2>/dev/null || true
          cp /tmp/pytest.txt ci-evidence/ 2>/dev/null || true
          cp /tmp/health-before.json ci-evidence/ 2>/dev/null || true
          cp /tmp/created.json ci-evidence/ 2>/dev/null || true
          cp /tmp/updated.json ci-evidence/ 2>/dev/null || true
          cp /tmp/health-after.json ci-evidence/ 2>/dev/null || true
          cp /tmp/persisted.json ci-evidence/ 2>/dev/null || true
          cp /tmp/postgres-rows.txt ci-evidence/ 2>/dev/null || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-3-docker-compose-evidence
          path: /tmp/project/ci-evidence/

      - name: Commit evidence onto original AI history and replace bootstrap branch
        working-directory: /tmp/project
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md evidence/requirements-audit.md evidence/github-actions-docker-postgres.txt
          git commit -m 'test: verify real Docker Compose PostgreSQL persistence'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main

      - name: Clean up containers and volume
        if: always()
        working-directory: /tmp/project
        shell: bash
        run: docker compose down -v --remove-orphans || true
