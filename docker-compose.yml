services:
  db:
    image: postgres:16-alpine
    env_file:
      - ${APP_ENV_FILE:-.env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - flyrank_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:?Set API_PORT in .env}:8000"

volumes:
  flyrank_postgres_data: