services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flyrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyrank_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-flyrank}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - flyrank_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-flyrank}:${POSTGRES_PASSWORD:-flyrank_dev_password}@db:5432/${POSTGRES_DB:-flyrank}}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  flyrank_postgres_data: